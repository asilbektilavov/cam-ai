services:
  db:
    image: postgres:16-alpine
    container_name: camai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: camai
      POSTGRES_USER: camai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-camai_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "fsync=on"
      - "-c"
      - "full_page_writes=on"
      - "-c"
      - "synchronous_commit=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camai"]
      interval: 10s
      timeout: 5s
      retries: 5

  cam-ai:
    image: camai-cam-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camai-app
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://camai:${DB_PASSWORD:-camai_secret_2024}@127.0.0.1:5432/camai
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-to-random-string}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_TRUST_HOST=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - YOLO_SERVICE_URL=http://127.0.0.1:8001
      - ATTENDANCE_SERVICE_URL=http://127.0.0.1:8002
      - GO2RTC_URL=http://127.0.0.1:1984
      # Bridge gateway (172.18.0.1) is reachable from both host-network containers
      # (attendance, line-crossing, go2rtc) and the bridge-network detector.
      # Used to build the URL handed to AI services when useGo2rtcForStream=true.
      - GO2RTC_RTSP_HOST=${GO2RTC_RTSP_HOST:-172.18.0.1}
      # Container clock is UTC by default but the recorder labels segments via
      # ffmpeg's strftime — without TZ we get UTC filenames the user has to
      # mentally translate. Pin to Asia/Tashkent so folders, filenames, and
      # all the JS Date.getHours() calls in StreamManager line up with the
      # wall clock the staff sees.
      - TZ=${TZ:-Asia/Tashkent}
      - LINE_CROSSING_SERVICE_URL=http://127.0.0.1:8004
    volumes:
      - cam-ai-data:/app/data
      - uploads:/app/public/uploads
      # External disks — allows user to select HDD/SSD for recordings via UI
      - /mnt:/mnt
      # Hardware binding (read-only access to host identifiers)
      - /etc/machine-id:/etc/machine-id:ro
      - /sys/class/dmi/id/:/sys/class/dmi/id/:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  detector:
    image: camai-detector:latest
    build: ./detection-service
    container_name: camai-detector
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - YOLO_CONFIDENCE=0.65
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # attendance/plate need LAN access for RTSP cameras — use host network
  attendance:
    image: camai-attendance:latest
    build: ./attendance-service
    container_name: camai-attendance
    restart: unless-stopped
    network_mode: host
    environment:
      - CAM_AI_API_URL=http://127.0.0.1:3000
      - ATTENDANCE_API_KEY=${ATTENDANCE_API_KEY:-}
      - POLL_INTERVAL=0.5
      - MATCH_TOLERANCE=0.45
      - COOLDOWN_SECONDS=300

  line-crossing:
    image: camai-line-crossing:latest
    build:
      context: ./line-crossing-service
      args:
        # Use NVIDIA CUDA base image when GPU is available:
        #   BASE_IMAGE=nvidia/cuda:12.1.0-runtime-ubuntu22.04
        # Default (no GPU): python:3.11-slim
        BASE_IMAGE: ${LINE_CROSSING_BASE_IMAGE:-python:3.11-slim}
    container_name: camai-line-crossing
    restart: unless-stopped
    network_mode: host
    environment:
      - CAM_AI_API_URL=http://127.0.0.1:3000
      - ATTENDANCE_API_KEY=${ATTENDANCE_API_KEY:-}
      - POLL_INTERVAL=0.3
      - MATCH_TOLERANCE=0.55
      - COOLDOWN_SECONDS=120
    # GPU support (requires nvidia-container-toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      cam-ai:
        condition: service_healthy

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: camai-go2rtc
    restart: unless-stopped
    network_mode: host
    environment:
      - GO2RTC_API_LISTEN=:1984
      - GO2RTC_API_ORIGIN=*
      - GO2RTC_WEBRTC_LISTEN=:8555
      - GO2RTC_RTSP_LISTEN=:8554
    volumes:
      - go2rtc-data:/config

  nginx:
    image: nginx:alpine
    container_name: camai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health-nginx"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
  cam-ai-data:
    driver: local
  uploads:
    driver: local
  go2rtc-data:
    driver: local
